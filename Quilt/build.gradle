plugins {
	id 'org.quiltmc.loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	maven { url = "https://maven.quiltmc.org/repository/release/" }
	maven { url = "https://api.modrinth.com/maven" }
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"luckybreak" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}

}

tasks.named("runClient", JavaExec).configure {
	systemProperty "loader.remapClasspathFile", project.file(".gradle/loom-cache/remapClasspath.txt").absolutePath
	systemProperty "log4j.configurationFile", project.file("tools/runclient-log4j2.xml").toURI().toString()
	doFirst {
		jvmArgs "-Dfabric.dli.main=org.quiltmc.loader.impl.launch.knot.KnotClient"
		jvmArgs "-Dloader.development=true"
		jvmArgs "-Dfabric.development=true"

		def launchCfg = project.file(".gradle/loom-cache/launch.cfg")
		if (launchCfg.exists()) {
			launchCfg.eachLine { rawLine ->
				def line = rawLine.trim()
				if (line.startsWith("fabric.remapClasspathFile=")) {
					jvmArgs "-Dloader.remapClasspathFile=${line.substring("fabric.remapClasspathFile=".length())}"
				}
				if (line.startsWith("fabric.gameJarPath=")) {
					jvmArgs "-Dloader.gameJarPath=${line.substring("fabric.gameJarPath=".length())}"
				}
				if (line.startsWith("fabric.defaultModDistributionNamespace=")) {
					jvmArgs "-Dloader.defaultModDistributionNamespace=${line.substring("fabric.defaultModDistributionNamespace=".length())}"
				}
				if (line.startsWith("fabric.defaultMixinRemapType=")) {
					jvmArgs "-Dloader.defaultMixinRemapType=${line.substring("fabric.defaultMixinRemapType=".length())}"
				}
			}
		}

		def loomCacheDir = project.file(".gradle/loom-cache")
		def remapClasspath = file("${loomCacheDir}/remapClasspath.txt")
		if (remapClasspath.exists()) {
			jvmArgs "-Dloader.remapClasspathFile=${remapClasspath.absolutePath}"
		}
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "org.quiltmc:quilt-loader:${project.quilt_loader_version}"
	runtimeOnly "org.quiltmc:quilt-json5:1.0.4+final"
	runtimeOnly "org.quiltmc:quilt-config:1.3.3"
	modCompileOnly "maven.modrinth:modmenu:${project.modmenu_version}"
	
}

processResources {
	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
	inputs.property "version", project.version
	inputs.property "group", project.group

	filesMatching(["quilt.mod.json"]) {
		expand "version": inputs.properties.version, "group": inputs.properties.group
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
	inputs.property "archivesName", project.base.archivesName
	inputs.property "version", project.version
	inputs.property "group", project.group

	from("LICENSE") {
		rename { "${it}_${inputs.properties.archivesName}"}
	}
}

tasks.named("sourcesJar", Jar).configure {
	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}